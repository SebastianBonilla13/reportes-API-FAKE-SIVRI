openapi: 3.0.3
info:
  title: SIVRI Reportes Estadísticos API
  version: 1.0.0

paths:
  /reportes-estadisticos/tipos-disponibles:
    get:
      summary: Obtener catálogo de reportes disponibles
      operationId: obtenerTiposDisponibles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReportes'

  /reportes-estadisticos/{codigo}/listar-datos-reporte:
    post:
      summary: Consultar datos de un reporte
      operationId: listarDatosReporte
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            example: R01
        - name: pageNo
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FiltrosReporteRequest'
      responses:
        '200':
          description: Datos paginados del reporte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReportePaginado'

  /reportes-estadisticos/{codigo}/generar:
    post:
      summary: Generar y descargar archivo del reporte
      operationId: generarReporte
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            example: R02
        - name: formato
          in: query
          required: true
          schema:
            type: string
            enum: [pdf, excel]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FiltrosReporteRequest'
      responses:
        '200':
          description: Archivo generado
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /reportes-estadisticos/{codigo}/estadisticas:
    post:
      summary: Obtener cálculos estadísticos de un reporte
      operationId: obtenerEstadisticasReporte
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
            example: R04
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FiltrosReporteRequest'
      responses:
        '200':
          description: Datos estadísticos agrupados listos para graficar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEstadisticas'

#----

components:
  schemas:

    ApiResponseEstadisticas:
      type: object
      properties:
        status:
          type: integer
          example: 200
        userMessage:
          type: string
          example: Ok
        developerMessage:
          type: string
          example: ""
#          listado de reportes
        data:
          type: object
          additionalProperties: true
          nullable: true

    ApiResponseReportes:
      type: object
      properties:
        status:
          type: integer
          example: 200
        userMessage:
          type: string
          example: Ok
        developerMessage:
          type: string
          example: ""
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReporteMetadata'

    ApiResponseReportePaginado:
      type: object
      properties:
        status:
          type: integer
          example: 200
        userMessage:
          type: string
          example: Ok
        developerMessage:
          type: string
          example: ""
        data:
          $ref: '#/components/schemas/PageReporteData'

    ReporteMetadata:
      type: object
      properties:
        id:
          type: integer
        codigo:
          type: string
        titulo:
          type: string
        descripcion:
          type: string
        columnasIncluidas:
          type: array
          items:
            type: string
        filtrosDisponibles:
          type: array
          items:
            $ref: '#/components/schemas/FiltroDisponible'
        estadisticas:
          type: array
          items:
            $ref: '#/components/schemas/ConfiguracionEstadisticas'
        formato:
          type: array
          items:
            type: string
        configuracionFechas:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ConfiguracionFechas'

    ConfiguracionFechas:
      type: object
      properties:
        tipo:
          type: string
          enum: [ INTERVALO, EVENTO ]
          description: "INTERVALO cruza dos columnas. EVENTO evalúa una sola columna."
        filtroDesde:
          type: string
          description: "Llave del JSON que envía el frontend como límite inferior (ej. fechaInicioRol)"
        filtroHasta:
          type: string
          description: "Llave del JSON que envía el frontend como límite superior (ej. fechaFinRol)"
        columnaInicio:
          type: string
          nullable: true
          description: "Columna en la BD para el inicio (Solo si es INTERVALO)"
        columnaFin:
          type: string
          nullable: true
          description: "Columna en la BD para el fin (Solo si es INTERVALO)"
        columnaFecha:
          type: string
          nullable: true
          description: "Columna única en la BD (Solo si es EVENTO, ej. fechaPublicacion)"

    ConfiguracionEstadisticas:
      type: object
      properties:
        id:
          type: string
          description: "Llave del gráfico (ej. roles_por_facultad)"
        titulo:
          type: string
          description: "Título legible para el frontend"
        tipoGrafico:
          type: string
          enum: [ CIRCULAR, BARRAS_APILADAS ]
          description: "Define el motor matemático a usar"
        campoAgrupacion:
          type: string
          description: "Columna para el Eje X o llave del Pie"
        campoSerie:
          type: string
          nullable: true
          description: "Columna para las series en barras apiladas"
        filtroFijoClave:
          type: string
          nullable: true
          description: "Si el gráfico requiere filtrar la data antes (ej. estadoGrupo)"
        filtroFijoValor:
          type: string
          nullable: true
          description: "Valor del filtro fijo (ej. ACTIVO)"
        maxCategorias:
          type: integer
          nullable: true
          description: "Límite visual para gráficos circulares antes de agrupar en 'Otros'"
        ocultarConFiltros:
          type: array
          items:
            type: string
          nullable: true
          description: "Lista de llaves de filtros que, si están activos, ocultarán este gráfico"
        ignorarLimiteConFiltros:
          type: array
          items:
            type: string
          nullable: true
          description: "Si estos filtros están activos, no se agrupará en 'Otros' (ignora maxCategorias)"


    FiltroDisponible:
      type: object
      properties:
        nombre:
          type: string
        tipo:
          type: string
          enum: [input, combobox, date]

    FiltrosReporteRequest:
      type: object
      properties:
        filtros:
          type: object
          additionalProperties: true
          nullable: true
        data:
          type: array
          items:
            type: object
            additionalProperties: true
          nullable: true


    GenerarReporteRequest:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true

    PageReporteData:
      type: object
      properties:
        content:
          type: array
          items:
            type: object
            additionalProperties: true
        pageable:
          $ref: '#/components/schemas/Pageable'
        totalElements:
          type: integer
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
        empty:
          type: boolean

    Pageable:
      type: object
      properties:
        pageNumber:
          type: integer
        pageSize:
          type: integer
        offset:
          type: integer
        paged:
          type: boolean
        unpaged:
          type: boolean